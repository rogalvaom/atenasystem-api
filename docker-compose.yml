version: '3.8'

services:
  web:
    build:
      context: .
    image: apache-php:8.2
    container_name: api_atenasystem
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./000-default.conf:/etc/apache2/sites-enabled/000-default.conf
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html
    working_dir: /var/www/html
    command: >
      bash -c "
      a2enmod rewrite && \
      apache2-foreground"
    restart: always
    networks:
      - internal-network

  db:
    image: mysql:8.0
    container_name: db_atenasystem
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
    restart: always
    networks:
     - internal-network

networks:
  internal-network:
    driver: bridge
